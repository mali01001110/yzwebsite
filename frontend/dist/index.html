    <!-- The site ships both protocols, and the browser chrome has to follow the

    <!-- Open Graph / Twitter. The card image is the brand mark rather than a
         composed 1200x630 banner: it is the only image in the project that
         belongs to this design, and a square mark is the shape a `summary`
         card is built around. It is served as SVG, which Facebook, LinkedIn
         and X do not rasterise — those three fall back to the text-only card
         until a PNG exists. Crawlers that do accept vector (Slack, Discord,
         Signal, most feed readers) render it at full resolution. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SYS.OVERRIDE_V.02 // YANN ZAKPA" />
    <meta property="og:title" content="Yann Zakpa — Full-Stack Developer &amp; IT Technician" />
    <meta
      property="og:description"
      content="Portfolio, credentials, projects and contact. Python, JavaScript, Django and React, with Harvard CS50x and CS50P certification."
    />
    <meta property="og:url" content="https://yannzakpa.space/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:image" content="https://yannzakpa.space/favicon.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="256" />
    <meta
      property="og:image:alt"
      content="Smartone Metaware logo: a black quill on a red ground"
    />
    <!-- `summary`, not `summary_large_image`: the mark is square, and the wide
         card would letterbox it into a thin strip of black. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yann Zakpa — Full-Stack Developer &amp; IT Technician" />

    <meta
      name="twitter:image:alt"
      content="Smartone Metaware logo: a black quill on a red ground"
    />

    <!-- The `?v=` token is a cache-buster, not decoration. Browsers keep tab
         icons in a store of their own that survives a hard reload and often a
         cache clear, so replacing the file on disk is not enough to dislodge
         the icon a visitor has already seen. Bump the number whenever the mark
         itself changes; the query string is ignored by the server. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Applies the saved protocol before first paint. Deliberately inline and
      // blocking: deferring this to the React bundle means the page renders
      // once in the default (night) palette and then repaints, which is a
      // white-to-black flash for every day-mode visitor on every load.
      (function () {
        try {
          var saved = localStorage.getItem('yz.theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'day'
              : 'night');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme =
            theme === 'day' ? 'light' : 'dark';
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'night');
        }
      })();
    </script>
