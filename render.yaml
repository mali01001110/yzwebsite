databases:
  # A free Postgres instance expires 30 days after creation and is deleted
  # permanently 14 days later, taking every contact message and visitor record
  # with it. `plan` is set explicitly so that fate is a decision rather than a
  # default.
  - name: yzwebsite-db
    databaseName: yzwebsite
    user: yzwebsite
    plan: free
    # Must equal the web service's region. Render's private hostname
    # (dpg-...-a) resolves only within a single region, so a mismatch fails
    # `migrate` with an unresolvable host rather than a connection error.
    #
    # Region is fixed at creation and Render rejects any later change, so this
    # line only takes effect while the database does not yet exist. If it ever
    # needs to move again, the database has to be deleted first.
    region: ohio

services:
  - type: web
    name: yzwebsite
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    # Free web services do not support pre-deploy commands or Shell access.
    # Initialize the database and configured admin when the instance starts.
    startCommand: "python manage.py migrate && python manage.py bootstrap_admin && gunicorn yzwebsiteproject.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Where the Django admin is mounted. `sync: false` keeps the value out
      # of this file and out of the public repository — Render prompts for it
      # on first apply and remembers it. Required: with DEBUG off and this
      # unset the service refuses to boot, rather than republishing the panel
      # at '/admin/'.
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: "yannzakpa.space,www.yannzakpa.space"
      - key: DATABASE_URL
        sync: false
      # Cloudflare proxies the domain in front of Render's own load balancer,
      # so two hops of X-Forwarded-For are written by trusted infrastructure.
      # Lowering this records the proxy's address instead of the visitor's;
      # raising it lets a visitor forge the address that gets logged.
      - key: DJANGO_TRUSTED_PROXY_COUNT
        value: "2"
      - key: PYTHON_VERSION
        value: "3.13.4"
