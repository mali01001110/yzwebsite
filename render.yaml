databases:
  - name: yzwebsite-db
    databaseName: yzwebsite
    user: yzwebsite

services:
  - type: web
    name: yzwebsite
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn yzwebsiteproject.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "yannzakpa.space,www.yannzakpa.space"
      - key: DATABASE_URL
        fromDatabase:
          name: yzwebsite-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.4"
