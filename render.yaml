databases:
  # A free Postgres instance expires 30 days after creation and is deleted
  # permanently 14 days later, taking every contact message and visitor record
  # with it. `plan` is set explicitly so that fate is a decision rather than a
  # default.
  - name: yzwebsite-db
    databaseName: yzwebsite
    user: yzwebsite
    plan: basic-256mb
    # Must match the web service's region below. Render's internal database
    # hostname (dpg-...-a) only resolves within a single region, so a mismatch
    # fails the build at `migrate` with an unresolvable-host error rather than
    # a connection error.
    region: oregon

services:
  - type: web
    name: yzwebsite
    runtime: python
    plan: starter
    region: oregon  # Must match the database's region above.
    buildCommand: "./build.sh"
    startCommand: "gunicorn yzwebsiteproject.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "yannzakpa.space,www.yannzakpa.space"
      - key: DATABASE_URL
        fromDatabase:
          name: yzwebsite-db
          property: connectionString
      # Cloudflare proxies the domain in front of Render's own load balancer,
      # so two hops of X-Forwarded-For are written by trusted infrastructure.
      # Lowering this records the proxy's address instead of the visitor's;
      # raising it lets a visitor forge the address that gets logged.
      - key: DJANGO_TRUSTED_PROXY_COUNT
        value: "2"
      - key: PYTHON_VERSION
        value: "3.13.4"
